name: Deploy to GitHub Pages

# Builds the frontend as a static site and publishes it. There is no server on Pages, so this build
# leaves NEXT_PUBLIC_API_BASE_URL unset and the app talks to Scryfall directly. Card Kingdom and
# Mana Pool prices are unavailable in that mode — see the Hosting section of the README.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build static site
        working-directory: src/frontend
        env:
          GITHUB_PAGES: 'true'
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Disable Jekyll processing
        run: touch src/frontend/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src/frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
